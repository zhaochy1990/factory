name: factory

services:
  openclaw-gateway:
    build:
      context: .
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: factory-openclaw:poc
    container_name: factory-openclaw
    restart: unless-stopped
    # 仅宿主机 loopback 可达（ADR-0001 安全基线：Gateway 永不暴露公网）
    ports:
      - "127.0.0.1:18789:18789"
    env_file: .env
    environment:
      # agents 的 git 身份（GitHub 全用 CEO 账号+署名脚注，#634 决议）
      GIT_CONFIG_GLOBAL: /workspace/factory/config/gitconfig
    volumes:
      - openclaw-state:/home/node/.openclaw
      - .:/workspace/factory
      - ${RUNNING_REPO:-/Users/zhaochaoyi/workspace/stride/running}:/workspace/running
      - ${CLAUDE_SKILLS_DIR:-/Users/zhaochaoyi/.claude/skills}:/home/node/.claude/skills:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  openclaw-cli:
    image: factory-openclaw:poc
    profiles: ["cli"]
    entrypoint: ["openclaw"]
    # 共享网关 PID 命名空间，否则共享状态所有权校验拒绝 config 写入
    pid: "service:openclaw-gateway"
    env_file: .env
    environment:
      GIT_CONFIG_GLOBAL: /workspace/factory/config/gitconfig
    volumes:
      - openclaw-state:/home/node/.openclaw
      - .:/workspace/factory
      - ${RUNNING_REPO:-/Users/zhaochaoyi/workspace/stride/running}:/workspace/running
      - ${CLAUDE_SKILLS_DIR:-/Users/zhaochaoyi/.claude/skills}:/home/node/.claude/skills:ro

volumes:
  openclaw-state:
